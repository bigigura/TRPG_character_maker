<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キャラシ制作キッド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- inport data -->
  <div style="position: absolute; left: 20px; top: 815px;">
    <button id="saveData">データ保存</button>
    <button id="loadData">データ読込</button>
    <button id="saveImage">画像保存</button>
    <input type="file" id="loadFile" accept=".json" style="display: none;">
  </div>

  <!-- image system -->
  <label class="image-picker-zone"><img class="preview" alt="プレビュー画像"></label>
  <input type="file" class="imageInput" accept="image/*">

  <!-- image text -->
  <input type="text" class="text big with_bottom_border" style="left: 160px; top: 370px; width: 300px;" placeholder="キャラ名">
  <input type="text" class="text gray mini" style="left: 160px; top: 340px;" placeholder="ふりがな">

  <!-- profile -->
  <label class="text left" style="left: 360px; top: 20px;">プロフィール</label>

  <label class="text left mini" style="left: 420px; top: 45px;">職業</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 460px; top: 45px; width: 180px;">

  <label class="text left mini" style="left: 690px; top: 45px;">出身</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 730px; top: 45px; width: 180px;">

  <label class="text left mini" style="left: 495px; top: 85px;">性別</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 535px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 610px; top: 85px;">身長</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 650px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 725px; top: 85px;">体重</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 765px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 840px; top: 85px;">年齢</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 880px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 955px; top: 85px;">髪色</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 995px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 1070px; top: 85px;">目色</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 1110px; top: 85px; width: 50px;">

  <label class="text left mini" style="left: 1185px; top: 85px;">膚色</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 1225px; top: 85px; width: 50px;">

  <!-- status -->
  <label class="text left" style="left: 360px; top: 130px;">ステータス</label>

  <label class="text" style="left: 400px; top: 155px;">STR</label>
  <input type="number" class="text big with_bottom_border" style="left: 400px; top: 180px; width: 65px;">

  <label class="text" style="left: 500px; top: 155px;">CON</label>
  <input type="number" class="text big with_bottom_border" style="left: 500px; top: 180px; width: 65px;">

  <label class="text" style="left: 600px; top: 155px;">POW</label>
  <input type="number" class="text big with_bottom_border" style="left: 600px; top: 180px; width: 65px;">

  <label class="text" style="left: 700px; top: 155px;">DEX</label>
  <input type="number" class="text big with_bottom_border" style="left: 700px; top: 180px; width: 65px;">

  <label class="text" style="left: 800px; top: 155px;">APP</label>
  <input type="number" class="text big with_bottom_border" style="left: 800px; top: 180px; width: 65px;">

  <label class="text" style="left: 900px; top: 155px;">SIZ</label>
  <input type="number" class="text big with_bottom_border" style="left: 900px; top: 180px; width: 65px;">

  <label class="text" style="left: 1000px; top: 155px;">INT</label>
  <input type="number" class="text big with_bottom_border" style="left: 1000px; top: 180px; width: 65px;">

  <label class="text" style="left: 1100px; top: 155px;">EDU</label>
  <input type="number" class="text big with_bottom_border" style="left: 1100px; top: 180px; width: 65px;">

  <span class="text left mini" style="left: 495px; top: 215px;">幸運 <input type="text" class="text left mini with_bottom_border" id="luck" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 575px; top: 215px;">HP <input type="text" class="text left mini with_bottom_border" id="hp" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 655px; top: 215px;">MP <input type="text" class="text left mini with_bottom_border" id="mp" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 735px; top: 215px;">SAN <input type="text" class="text left mini with_bottom_border" id="san" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 815px; top: 215px;">不定 <input type="text" class="text left mini with_bottom_border" id="indefinite" readonly style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 895px; top: 215px;">アイデア <input type="text" class="text left mini with_bottom_border" id="idea" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 975px; top: 215px;">知識 <input type="text" class="text left mini with_bottom_border" id="knowledge" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 1055px; top: 215px;">MOV <input type="text" class="text left mini with_bottom_border" id="mov" style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 1135px; top: 215px;">DB <input type="text" class="text left mini with_bottom_border" id="db" readonly style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 1215px; top: 215px;">ビルド <input type="text" class="text left mini with_bottom_border" id="build" readonly style="display: block; width: 55px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 100px; top: 425px;">職業P <input type="text" class="text left mini with_bottom_border" id="job-point" readonly style="display: block; width: 110px; margin-top: 5px;"></span>
  <span class="text left mini" style="left: 230px; top: 425px;">興味P <input type="text" class="text left mini with_bottom_border" id="interest-point" readonly style="display: block; width: 110px; margin-top: 5px;"></span>

  <!-- skills -->
  <label class="text left" style="left: 25px; top: 420px;">技能</label>

  <label class="text left mini" style="left: 40px; top: 470px;">技能名</label>
  <label class="text left mini" style="left: 370px; top: 470px;">初期値</label>
  <label class="text left mini" style="left: 425px; top: 470px;">職業</label>
  <label class="text left mini" style="left: 480px; top: 470px;">興味</label>
  <label class="text left mini" style="left: 535px; top: 470px;">成長</label>
  <label class="text left mini" style="left: 590px; top: 470px;">合計</label>

  <label class="text left mini" style="left: 670px; top: 470px;">技能名</label>
  <label class="text left mini" style="left: 1000px; top: 470px;">初期値</label>
  <label class="text left mini" style="left: 1055px; top: 470px;">職業</label>
  <label class="text left mini" style="left: 1110px; top: 470px;">興味</label>
  <label class="text left mini" style="left: 1165px; top: 470px;">成長</label>
  <label class="text left mini" style="left: 1220px; top: 470px;">合計</label>

  <div class="skill-list" style="position: absolute; left: 40px; top: 480px;" ></div>
  <div class="skill-list" style="position: absolute; left: 670px; top: 480px;" ></div>

  <!-- weapons -->
  <label class="text left"
    style="left: 360px; top: 285px;">武器</label>
  
  <label class="text left mini" style="left: 440px; top: 290px;">武器名</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 440px; top: 310px; width: 200px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 440px; top: 340px; width: 200px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 440px; top: 370px; width: 200px;">

  <label class="text left mini" style="left: 650px; top: 290px;">成功値</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 650px; top: 310px; width: 150px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 650px; top: 340px; width: 150px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 650px; top: 370px; width: 150px;">
  
  <label class="text left mini" style="left: 810px; top: 290px;">ダメージ</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 810px; top: 310px; width: 150px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 810px; top: 340px; width: 150px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 810px; top: 370px; width: 150px;">

  <label class="text left mini" style="left: 970px; top: 290px;">メモ</label>
  <input type="text" class="text left mini with_bottom_border" style="left: 970px; top: 310px; width: 300px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 970px; top: 340px; width: 300px;">
  <input type="text" class="text left mini with_bottom_border" style="left: 970px; top: 370px; width: 300px;">

  <!-- lines -->
  <label class="line" style="left: 335px; top: 10px; width: 1px; height: 380px;"></label>
  <label class="line" style="left: 350px; top: 110px; width: 930px; height: 1px;"></label>
  <label class="line" style="left: 350px; top: 260px; width: 930px; height: 1px;"></label>
  <label class="line" style="left: 10px; top: 400px; width: 1275px; height: 1px;"></label>
  <label class="line" style="left: 10px; top: 810px; width: 1275px; height: 1px;"></label>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="system.js"></script>
</body>
